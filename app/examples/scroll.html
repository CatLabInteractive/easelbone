<!DOCTYPE html>
<html>
<head lang="en">

</head>

<body>

<!-- Ze canvas -->
<div id="container" style="width: 1024px; height: 768px;"></div>

<!-- Ze requirejs -->
<script src="../scripts/vendor/requirejs/require.js"></script>

<!-- Ze game code -->
<script>

	require.config ({
		'baseUrl' : '../scripts/',
		'urlArgs' : 'bust=v2'
	});

	require ([ 'main' ], function (easelbone)
	{
		// Some additional config to load the assets is required here.
		require.config ({
			'paths' : {
				'assets' : '../examples/assets/easelboneassets'
			},

			'shim' : {
				assets: {
					exports: "lib"
				}
			}
		});

		// We'll need backbone to define our view, and easeljs to handle our rendering.
		// We'll also need the assets.
		require ([
					'backbone',
					'easeljs',
					'assets'
				],
				function (
						backbone,
						createjs,
						assets
				) {

					createjs.Ticker.timingMode = createjs.Ticker.TIMEOUT;
					createjs.Ticker.setFPS (24);

					var dirtyRendering = /[?&]dirtyRendering=1/.test(window.location.search);
					var rootView = new easelbone.Views.Root ({'container': document.getElementById ('container'), 'dirtyRendering': dirtyRendering });

					rootView.stage.enableMouseOver(20);

					// Set default properties
					easelbone.setProperties (assets.properties);

					// Ticker
					//createjs.Ticker.setFPS (assets.properties.fps);


					// Load assets
                    var loader = new easelbone.Loader();
					loader.loadAssets (assets, '../examples/assets/');

					// Prepare our "users"
					var users = [
						new easelbone.FakeWebremote.KeyboardUser ()
					];

					// And actually do load them.
					loader.load (function () {

						// NOW WE ARE READY FOR THE REAL SHIZZLE
						// Create a view and add it to the root.

						// An example settings view.slider1
						var ExampleView = easelbone.Views.Navigatable.extend ({

							initialize : function () {

								// First call the parent.
								this.initializeNavigable ({ 'orientation' : 'vertical' });

								// Now set the view
								this.view = new assets.ExampleScrollArea ();

								this.list = new easelbone.Controls.List (assets.ExampleListElement, 2);
								this.scroll = new easelbone.Controls.ScrollArea (this.view.scrollcontent);
								var scroll = this.scroll;

								this.scroll.content.addChild (this.list);

								// tools/touch-scroll-test.js reads these hooks.
								var hooks = window.__scroll = { ready: false, clicks: [] };
								this.items = [];

								for (var i = 1; i <= 10; i++) {
									var item = this.list.createElement ();
									item.element.text.text = 'Item ' + i;
									this.items.push (item);

									// Which row a tap lands on (an EaselJS click on the symbol).
									item.element.on ('click', function (index) {
										hooks.clicks.push (index);
									}.bind (null, i - 1));
								}

								var item10 = this.items[9];
								var view = this;

								// Canvas pixels of a display object's box (the stage is not scaled).
								function rect (object, b) {
									var p = object.localToGlobal (b.x, b.y);
									var q = object.localToGlobal (b.x + b.width, b.y + b.height);
									return { x: p.x, y: p.y, w: q.x - p.x, h: q.y - p.y };
								}

								hooks.touchEnabled = function () { return !!rootView.stage.__touch; };
								hooks.scroll = function () { return view.scroll.content.getScroll (); };
								hooks.max = function () {
									var c = view.scroll.content;
									return c.getBounds ().height - c.parent.getBounds ().height;
								};
								hooks.itemRect = function (index) {
									var element = view.items[index].element;
									return rect (element, element.nominalBounds);
								};
								// Canvas pixels per content unit: the view is scaled to fit.
								hooks.scale = function () {
									var surface = view.scroll.content.parent;
									return rect (surface, surface.getBounds ()).h / surface.getBounds ().height;
								};
								hooks.windowRect = function () {
									var surface = view.scroll.content.parent;
									return rect (surface, surface.getBounds ());
								};

								setTimeout(function ()
								{
									scroll.focus(item10.element)
										.then (function () { hooks.ready = true; });
								}, 1000);


							},

							'render' : function () {

								this.addCenter (this.view);

							}

						});

						var view = new ExampleView ();
						view.setUsers (users);

						rootView.setView (view);
					});
				});
	});

</script>

</body>
</html>
